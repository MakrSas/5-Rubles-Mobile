name: Build Android APK

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp --skip-dependencies > /dev/null 2>&1 || true
          haxelib install extension-android --skip-dependencies > /dev/null 2>&1 || true

          # Install standard libraries
          haxelib install format --skip-dependencies > /dev/null 2>&1 || true
          haxelib install thx.semver --skip-dependencies > /dev/null 2>&1 || true
          haxelib install hxvlc --skip-dependencies > /dev/null 2>&1 || true
          haxelib install haxeui-openfl --skip-dependencies > /dev/null 2>&1 || true
          haxelib install hxdiscord_rpc --skip-dependencies > /dev/null 2>&1 || true
          haxelib install flixel-ui --skip-dependencies > /dev/null 2>&1 || true

          # Install core dependencies from local copies if available
          [ -d "rewritedLibs/openfl" ] && haxelib dev openfl rewritedLibs/openfl
          [ -d "rewritedLibs/lime" ] && haxelib dev lime rewritedLibs/lime
          [ -d "rewritedLibs/flixel" ] && haxelib dev flixel rewritedLibs/flixel
          [ -d "rewritedLibs/flxanimate" ] && haxelib dev flxanimate rewritedLibs/flxanimate
          [ -d "rewritedLibs/haxe" ] && haxelib dev haxe rewritedLibs/haxe

          echo "Haxelib installation completed"

      - name: Setup Lime for Android
        run: haxelib run lime setup android -y 2>&1 || true

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        run: haxelib run lime build android -debug

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5Rubles_${{github.run_id}}_Android
          path: export/debug/android/bin
          retention-days: 30
