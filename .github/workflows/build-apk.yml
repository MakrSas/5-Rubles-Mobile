name: Build Android APK

on:
  push:
    branches: [ main, develop, claude/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  buildAndroid:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;21.4.7075529" --sdk_root=$ANDROID_SDK_ROOT
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Install Haxelib
        run: |
          haxelib setup ~/haxelib

          # Core dependencies from Project.xml
          haxelib install hxcpp --skip-dependencies > /dev/null 2>&1 || true
          haxelib install lime 8.1.3 --skip-dependencies > /dev/null 2>&1 || haxelib git lime https://github.com/openfl/lime --skip-dependencies > /dev/null 2>&1 || true
          haxelib install openfl 9.3.4 --skip-dependencies > /dev/null 2>&1 || haxelib git openfl https://github.com/openfl/openfl --skip-dependencies > /dev/null 2>&1 || true
          haxelib install flixel 5.6.2 --skip-dependencies > /dev/null 2>&1 || haxelib git flixel https://github.com/HaxeFlixel/flixel --skip-dependencies > /dev/null 2>&1 || true
          haxelib install flixel-addons 3.2.3 --skip-dependencies > /dev/null 2>&1 || true
          haxelib install flixel-ui 2.6.1 --skip-dependencies > /dev/null 2>&1 || true

          # Android extensions
          haxelib install extension-androidtools --skip-dependencies > /dev/null 2>&1 || true
          haxelib git extension-orientation https://github.com/HaxeExtension/extension-orientation --skip-dependencies > /dev/null 2>&1 || true
          haxelib git extension-haptics https://github.com/LimeExtensions/extension-haptics --skip-dependencies > /dev/null 2>&1 || haxelib install extension-haptics --skip-dependencies > /dev/null 2>&1 || true

          # Other required libraries
          haxelib install format --skip-dependencies > /dev/null 2>&1 || true
          haxelib install hxp --skip-dependencies > /dev/null 2>&1 || true
          haxelib install thx.semver --skip-dependencies > /dev/null 2>&1 || true
          haxelib install polymod --skip-dependencies > /dev/null 2>&1 || true
          haxelib git flxanimate https://github.com/Redar13/flxanimate dev --skip-dependencies > /dev/null 2>&1 || true
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit --skip-dependencies > /dev/null 2>&1 || true
          haxelib git hscript-improved https://github.com/Redar13/hscript-improved polymod-scripted-classes --skip-dependencies > /dev/null 2>&1 || true
          haxelib install hxvlc --skip-dependencies > /dev/null 2>&1 || true
          haxelib install hxdiscord_rpc --skip-dependencies > /dev/null 2>&1 || true
          haxelib install funk.vis --skip-dependencies > /dev/null 2>&1 || true
          haxelib install grig.audio --skip-dependencies > /dev/null 2>&1 || true
          haxelib install haxeui-core 1.7.0 --skip-dependencies > /dev/null 2>&1 || true
          haxelib install haxeui-openfl 1.7.0 --skip-dependencies > /dev/null 2>&1 || true
          haxelib install hxcpp-debug-server --skip-dependencies > /dev/null 2>&1 || true

          echo "Haxelib installation completed"

      - name: Setup Lime for Android
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_ROOT
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime setup android -y

      - name: Create Version Tag
        run: echo "${{github.run_id}}" > VERSION

      - name: Compile
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
        run: haxelib run lime build android -debug

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 5Rubles_${{github.run_id}}_Android
          path: export/debug/android/bin
          retention-days: 30
