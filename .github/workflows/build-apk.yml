name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 34
          ndk-version: '26.1.10909125'

      - name: Install Haxe 4.3.6
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git
          mkdir -p ~/haxe
          cd ~/haxe
          wget -q https://github.com/HaxeFoundation/haxe/releases/download/4.3.6/haxe-4.3.6-linux64.tar.gz
          tar -xzf haxe-4.3.6-linux64.tar.gz
          echo "$PWD/haxe" >> $GITHUB_PATH
          cd haxe && chmod +x haxe haxelib && cd ..
          haxe -version

      - name: Install Haxe dependencies
        run: |
          haxelib newrepo
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp --skip-dependencies
          haxelib install lime 8.1.3 --skip-dependencies
          haxelib run lime setup -y -android
          haxelib install openfl 9.3.4 --skip-dependencies
          haxelib install flixel 5.6.2 --skip-dependencies
          haxelib install flixel-addons 3.2.3 --skip-dependencies
          haxelib install flixel-ui 2.6.1 --skip-dependencies
          haxelib install thx.semver --skip-dependencies
          haxelib install haxeui-openfl 1.7.0 --skip-dependencies
          haxelib git flxanimate https://github.com/Redar13/flxanimate dev --skip-dependencies
          haxelib git hscript-improved https://github.com/Redar13/hscript-improved polymod-scripted-classes --skip-dependencies
          haxelib install hxdiscord_rpc --skip-dependencies
          # Note: hxvlc (video) and linc_luajit are desktop-only, skip for Android

      - name: Build APK (Debug)
        run: |
          lime build android -debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: |
            export/release/android/bin/app-release.apk
            export/debug/android/bin/app-debug.apk
            export/android/bin/**/*.apk
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            **/build.log
            **/*.log
          retention-days: 7
