name: Build Desktop (Windows)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'source/**'
      - 'assets/**'
      - 'Project.xml'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install VLC (for hxvlc)
        run: |
          choco install vlc -y
          echo "✓ VLC installed successfully"

      - name: Install Haxe 4.3.6
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/HaxeFoundation/haxe/releases/download/4.3.6/haxe-4.3.6-win64.zip" -OutFile "haxe.zip"
          Expand-Archive -Path haxe.zip -DestinationPath "."
          echo "D:\a\5-Rubles-Mobile\5-Rubles-Mobile\haxe" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          haxe -version

      - name: Install Haxe dependencies
        run: |
          haxelib newrepo
          haxelib git hxcpp https://github.com/HaxeFoundation/hxcpp
          haxelib install lime 8.1.3
          haxelib run lime setup
          haxelib install openfl 9.3.4
          haxelib install flixel 5.6.2
          haxelib install flixel-addons 3.2.3
          haxelib install flixel-ui 2.6.1
          haxelib install thx.semver
          haxelib install hxvlc
          haxelib install haxeui-openfl 1.7.0
          haxelib git flxanimate https://github.com/Redar13/flxanimate dev
          haxelib git hscript-improved https://github.com/Redar13/hscript-improved polymod-scripted-classes
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit
          haxelib install hxdiscord_rpc

      - name: Build Windows Executable (Debug)
        run: |
          lime build windows -debug

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build
          path: |
            export/debug/windows/bin/**/*.exe
            export/release/windows/bin/**/*.exe
          retention-days: 30

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-windows
          path: |
            **/build.log
            **/*.log
          retention-days: 7
